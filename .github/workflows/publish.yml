name: Publish Flutter images

on:
  push:
    branches:
      - main
    paths:
      - sdk/**
      - versions.yml
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.matrix.outputs.images }}
    steps:
      - uses: actions/checkout@v6

      - name: Read Flutter image matrix
        id: matrix
        run: |
          images=$(ruby -ryaml -rjson -e "puts JSON.generate(YAML.load_file('versions.yml')['images'])")
          echo "images=$images" >> "$GITHUB_OUTPUT"

  publish:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.matrix.outputs.images) }}
    steps:
      - uses: actions/checkout@v6

      - name: Set image tags
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flutter"
          version_tag="${FLUTTER_VERSION/+/-}"

          {
            echo "image=$image"
            echo "version_tag=$version_tag"
            echo "tags<<EOF"
            echo "$image:$version_tag"
            echo "$image:$DOCKER_TAG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          DOCKER_TAG: ${{ matrix.image.docker_tag }}
          FLUTTER_VERSION: ${{ matrix.image.flutter_version }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: sdk
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            flutter_version=${{ matrix.image.flutter_version }}
