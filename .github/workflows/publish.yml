name: Publish Flutter images

on:
  push:
    branches:
      - main
    paths:
      - sdk/**
      - versions.yml
      - .github/workflows/publish.yml
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild and republish all Flutter images
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.matrix.outputs.images }}
    steps:
      - uses: actions/checkout@v6

      - name: Read and group Flutter image matrix
        id: matrix
        run: |
          images=$(ruby -ryaml -rjson -e '
            images = YAML.load_file("versions.yml")["images"]
            grouped_images = images.group_by { |image| image["flutter_version"] }.map do |flutter_version, entries|
              {
                "flutter_version" => flutter_version,
                "docker_tags" => entries.map { |entry| entry["docker_tag"] }.uniq
              }
            end
            puts JSON.generate(grouped_images)
          ')
          echo "images=$images" >> "$GITHUB_OUTPUT"

  publish:
    needs: matrix
    concurrency:
      group: publish-flutter-${{ matrix.image.flutter_version }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.matrix.outputs.images) }}
    steps:
      - uses: actions/checkout@v6

      - name: Set image tags
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flutter"
          version_tag="${FLUTTER_VERSION/+/-}"

          {
            echo "image=$image"
            echo "version_tag=$version_tag"
            echo "tags<<EOF"
            echo "$image:$version_tag"
            for docker_tag in $DOCKER_TAGS; do
              echo "$image:$docker_tag"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          DOCKER_TAGS: ${{ join(matrix.image.docker_tags, ' ') }}
          FLUTTER_VERSION: ${{ matrix.image.flutter_version }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the version image exists
        id: image
        env:
          FORCE_REBUILD: ${{ inputs.force_rebuild == true }}
          IMAGE: ${{ steps.tags.outputs.image }}
          VERSION_TAG: ${{ steps.tags.outputs.version_tag }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$FORCE_REBUILD" == "true" ]]; then
            echo "A forced rebuild was requested."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          image_path="${IMAGE#ghcr.io/}"
          version_tag="$VERSION_TAG"
          manifest_url="https://ghcr.io/v2/$image_path/manifests/$version_tag"
          max_attempts=3

          for attempt in $(seq 1 "$max_attempts"); do
            http_status="$(
              curl --silent --show-error --location --head \
                --connect-timeout 10 \
                --max-time 30 \
                --user "${GITHUB_ACTOR}:${REGISTRY_TOKEN}" \
                --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
                --output /dev/null \
                --write-out '%{http_code}' \
                "$manifest_url"
            )" || http_status=000

            case "$http_status" in
              200)
                echo "Image $version_tag already exists on GHCR; skipping the build."
                echo "should_build=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              404)
                echo "Image $version_tag does not exist on GHCR; building it."
                echo "should_build=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              401|403)
                echo "::error::GHCR rejected the image existence check with HTTP $http_status."
                exit 1
                ;;
              000|408|429|5??)
                if [[ "$attempt" -lt "$max_attempts" ]]; then
                  echo "GHCR returned HTTP $http_status; retrying ($attempt/$max_attempts)."
                  sleep $((attempt * 5))
                else
                  echo "::error::Unable to determine whether $version_tag exists on GHCR after $max_attempts attempts (HTTP $http_status)."
                  exit 1
                fi
                ;;
              *)
                echo "::error::Unexpected HTTP status $http_status while checking $version_tag on GHCR."
                exit 1
                ;;
            esac
          done

      - name: Build and push
        if: steps.image.outputs.should_build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: sdk
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          no-cache: ${{ inputs.force_rebuild == true }}
          pull: ${{ inputs.force_rebuild == true }}
          build-args: |
            flutter_version=${{ matrix.image.flutter_version }}
