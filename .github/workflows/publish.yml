name: Publish Flutter images

on:
  push:
    branches:
      - main
    paths:
      - sdk/**
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          # from https://flutter.dev/docs/development/tools/sdk/releases
          - DOCKER_TAG: latest
            FLUTTER_VERSION: 3.44.0
          - DOCKER_TAG: stable
            FLUTTER_VERSION: 3.44.0
          - DOCKER_TAG: beta
            FLUTTER_VERSION: 3.44.0-0.3.pre
    steps:
      - uses: actions/checkout@v6

      - name: Set image tags
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flutter"
          version_tag="${FLUTTER_VERSION/+/-}"

          {
            echo "image=$image"
            echo "version_tag=$version_tag"
            echo "tags<<EOF"
            echo "$image:$version_tag"
            echo "$image:$DOCKER_TAG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          DOCKER_TAG: ${{ matrix.image.DOCKER_TAG }}
          FLUTTER_VERSION: ${{ matrix.image.FLUTTER_VERSION }}

      # - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: sdk
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            flutter_version=${{ matrix.image.FLUTTER_VERSION }}
