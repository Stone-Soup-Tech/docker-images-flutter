name: Publish Flutter images

on:
  push:
    branches:
      - main
    paths:
      - sdk/**
      - versions.yml
      - .github/workflows/publish.yml
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild and republish all Flutter images
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.matrix.outputs.images }}
    steps:
      - uses: actions/checkout@v6

      - name: Read and group Flutter image matrix
        id: matrix
        run: |
          images=$(ruby -ryaml -rjson -e '
            images = YAML.load_file("versions.yml")["images"]
            grouped_images = images.group_by { |image| image["flutter_version"] }.map do |flutter_version, entries|
              {
                "flutter_version" => flutter_version,
                "docker_tags" => entries.map { |entry| entry["docker_tag"] }.uniq
              }
            end
            puts JSON.generate(grouped_images)
          ')
          echo "images=$images" >> "$GITHUB_OUTPUT"

  publish:
    needs: matrix
    concurrency:
      group: publish-flutter-${{ matrix.image.flutter_version }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.matrix.outputs.images) }}
    steps:
      - uses: actions/checkout@v6

      - name: Set image tags
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flutter"
          version_tag="${FLUTTER_VERSION/+/-}"

          {
            echo "image=$image"
            echo "version_tag=$version_tag"
            echo "tags<<EOF"
            echo "$image:$version_tag"
            for docker_tag in $DOCKER_TAGS; do
              echo "$image:$docker_tag"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          DOCKER_TAGS: ${{ join(matrix.image.docker_tags, ' ') }}
          FLUTTER_VERSION: ${{ matrix.image.flutter_version }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the version image exists
        id: image
        env:
          FORCE_REBUILD: ${{ inputs.force_rebuild == true }}
          IMAGE: ${{ steps.tags.outputs.image }}
          VERSION_TAG: ${{ steps.tags.outputs.version_tag }}
        run: |
          if [[ "$FORCE_REBUILD" == "true" ]]; then
            echo "A forced rebuild was requested."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          max_attempts=3

          for attempt in $(seq 1 "$max_attempts"); do
            if inspect_output="$(docker buildx imagetools inspect "$IMAGE:$VERSION_TAG" 2>&1)"; then
              echo "Image $VERSION_TAG already exists on GHCR; skipping the build."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if grep -Eiq 'not found|manifest unknown|no such manifest' <<< "$inspect_output"; then
              echo "Image $VERSION_TAG does not exist on GHCR; building it."
              echo "should_build=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [[ "$attempt" -lt "$max_attempts" ]]; then
              echo "Unable to inspect $VERSION_TAG on GHCR; retrying ($attempt/$max_attempts)."
              sleep $((attempt * 5))
            else
              echo "::error::Unable to determine whether $VERSION_TAG exists on GHCR after $max_attempts attempts."
              echo "$inspect_output"
              exit 1
            fi
          done

      - name: Build and push
        if: steps.image.outputs.should_build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: sdk
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          no-cache: ${{ inputs.force_rebuild == true }}
          pull: ${{ inputs.force_rebuild == true }}
          build-args: |
            flutter_version=${{ matrix.image.flutter_version }}
